<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; img-src 'self' data: https:; connect-src 'self' https://generativelanguage.googleapis.com https://*.googleapis.com;">
    <title>Serendib Browser</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              serendib: {
                maroon: '#800000',
                gold: '#FFD700',
                teal: '#008080',
                bg: '#f3f4f6',
                darkBg: '#000000',
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Custom styles for frameless window */
      .drag-region {
        -webkit-app-region: drag;
      }
      .no-drag {
        -webkit-app-region: no-drag;
      }
    </style>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="bg-gray-100 dark:bg-black text-gray-900 dark:text-gray-100 overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
